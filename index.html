<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mood Board</title>
  <!-- Link to our custom stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="mood-focused">

  <!-- Main container — everything is centered inside here -->
  <main class="container">

    <!-- Page title -->
    <h1 class="title">🎵 My Mood Board</h1>
    <p class="subtitle">Pick a vibe and let the music match your mood</p>

    <!-- Mood buttons — each button calls changeMood() when clicked -->
    <div class="mood-buttons">
      <button class="mood-btn active" data-mood="focused" onclick="changeMood('focused')">
        Focused 📚
      </button>
      <button class="mood-btn" data-mood="chill" onclick="changeMood('chill')">
        Chill 🌿
      </button>
      <button class="mood-btn" data-mood="hype" onclick="changeMood('hype')">
        Hype ⚡
      </button>
      <button class="mood-btn" data-mood="sad" onclick="changeMood('sad')">
        Sad 🌧️
      </button>
    </div>

    <!-- Spotify player — created by Spotify's iFrame API in script.js -->
    <div class="player-wrapper">
      <div id="embed-iframe" class="spotify-player" title="Spotify mood playlist"></div>
    </div>
    <p class="player-hint">Click a mood, then press ▶ in the player to start the playlist.</p>

  </main>

  <!-- Link to our JavaScript file (placed at the bottom so the page loads first) -->
  <script src="script.js"></script>
</body>
</html>
